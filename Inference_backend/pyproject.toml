[project]
name = "signmind-inference"
version = "0.1.0"
description = "SignMind AI — Python gRPC TSL inference service"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.81",
    "numpy>=1.26",
    "protobuf>=5.27",
    # TFLite runtime: install ONE of these in the runtime venv (x64 on
    # Windows — neither ships win_arm64 wheels, see Inference_backend/AGENTS.md):
    #   ai-edge-litert  (preferred)  or  tensorflow
]

[project.optional-dependencies]
# Serves the ExtractKeypoints RPC (MediaPipe pose + hand landmarkers over a
# recorded clip). An extra, not a runtime dependency: it is ~400 MB installed
# and a service that only answers StreamInference has no use for it — without
# it that one RPC reports FAILED_PRECONDITION and everything else still runs.
# The Docker image installs it (see Dockerfile).
#   >=0.10.35: every earlier release pins protobuf<5, which contradicts the
#   protobuf>=5.27 the generated stubs need.
# cv2 deliberately goes unlisted — mediapipe depends on opencv-contrib-python,
# and adding opencv-python alongside it puts two cv2 providers in one env.
extract = [
    "mediapipe>=0.10.35",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.81",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
extend-exclude = ["inference/pb"]  # generated stubs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
