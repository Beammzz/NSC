# SignMind — example production stack behind Traefik with automatic HTTPS.
#
#   cp .env.example .env      # then fill in every value marked REQUIRED
#   docker compose -f example-compose.yaml up -d
#
# Copy this to compose.yaml and adjust; it is checked in as a worked example,
# not as the file you edit in place.
#
# What this gives you:
#   traefik    :80 -> permanent redirect to :443, Let's Encrypt certs on :443
#   backend    Go API + embedded admin webui, reachable only through Traefik
#   inference  Python gRPC service, reachable only from backend on the internal
#              network — it is NEVER published to the host or the internet
#
# Prerequisites: an A/AAAA record for ${SIGNMIND_DOMAIN} pointing at this host,
# and ports 80 + 443 open. Port 80 must stay reachable — the ACME HTTP-01
# challenge and the renewal every ~60 days both use it.

name: signmind

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      # Routers are opted in per-container via labels, never by default.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Every plaintext request becomes a 301 to the same URL on HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt via the HTTP-01 challenge on the web entrypoint.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Uncomment while testing: the staging CA issues untrusted certs but has
      # far softer rate limits than the 5-failures-per-hour production one.
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      # Enables the /ping endpoint the healthcheck below calls.
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to watch container labels, and a writable
      # docker socket is root on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=false

  backend:
    # Published by .github/workflows/ci.yml on every merge to main.
    # Swap for `build: ./Backend` to run your working tree instead.
    image: ghcr.io/beammzz/nsc-backend:latest
    restart: unless-stopped
    depends_on:
      inference:
        condition: service_healthy
    environment:
      ENV: Prod
      SIGNMIND_HTTP_ADDR: ":8080"
      SIGNMIND_AI_ADDR: "inference:50051"
      SIGNMIND_DB_PATH: "/data/predictions.db"
      # Fatal at startup in Prod if unset — see resolveJWTSecret in main.go.
      SIGNMIND_JWT_SECRET: ${SIGNMIND_JWT_SECRET:?set SIGNMIND_JWT_SECRET in .env}
      # Must match the inference service exactly, or every gRPC call is rejected.
      SIGNMIND_AI_SHARED_SECRET: ${SIGNMIND_AI_SHARED_SECRET:?set SIGNMIND_AI_SHARED_SECRET in .env}
      # Seeds the first admin account on first boot only; ignored once one exists.
      SIGNMIND_ADMIN_EMAIL: ${SIGNMIND_ADMIN_EMAIL:-}
      SIGNMIND_ADMIN_PASSWORD: ${SIGNMIND_ADMIN_PASSWORD:-}
      SIGNMIND_ALLOW_SIGNUP: ${SIGNMIND_ALLOW_SIGNUP:-false}
      # Required here and safe here: Traefik is the only ingress and it
      # overwrites X-Forwarded-For. Without it every client looks like the
      # Traefik container and the login rate limiter becomes one shared bucket.
      SIGNMIND_TRUST_PROXY: "true"
    volumes:
      - backend-data:/data
    networks:
      - edge      # Traefik reaches the router here
      - internal  # and the backend reaches inference here
    labels:
      - traefik.enable=true
      - traefik.docker.network=signmind_edge
      - traefik.http.routers.signmind.rule=Host(`${SIGNMIND_DOMAIN:?set SIGNMIND_DOMAIN in .env}`)
      - traefik.http.routers.signmind.entrypoints=websecure
      - traefik.http.routers.signmind.tls=true
      - traefik.http.routers.signmind.tls.certresolver=letsencrypt
      - traefik.http.services.signmind.loadbalancer.server.port=8080
      # /api/v1/stream is a WebSocket. Traefik v3 proxies the Upgrade handshake
      # and then streams bidirectionally with no buffering, so it needs no extra
      # middleware, timeout, or annotation here.
      # Baseline hardening: HSTS + no framing. Drop or widen if you embed the
      # admin webui elsewhere.
      - traefik.http.middlewares.signmind-sec.headers.stsseconds=31536000
      - traefik.http.middlewares.signmind-sec.headers.stsincludesubdomains=true
      - traefik.http.middlewares.signmind-sec.headers.framedeny=true
      - traefik.http.middlewares.signmind-sec.headers.contenttypenosniff=true
      - traefik.http.routers.signmind.middlewares=signmind-sec

  inference:
    # Also serves ExtractKeypoints (MediaPipe), which is what the admin
    # Dictionary page's webcam recording and th-sl.com import call through the
    # backend — the backend image has no Python, so extraction lives here and
    # needs no configuration on either service.
    image: ghcr.io/beammzz/nsc-inference:latest
    restart: unless-stopped
    environment:
      # 0.0.0.0 so the backend container can dial it; still unreachable from
      # outside because this service publishes no ports and sits on `internal`.
      SIGNMIND_AI_ADDR: "0.0.0.0:50051"
      SIGNMIND_AI_SHARED_SECRET: ${SIGNMIND_AI_SHARED_SECRET:?set SIGNMIND_AI_SHARED_SECRET in .env}
    volumes:
      # Persists models uploaded through the admin webui. On first run Docker
      # seeds the empty volume from the image's baked-in TSL_Output, so the
      # service starts with a working model and keeps later uploads.
      - inference-models:/app/TSL_Output
    networks:
      - internal
    labels:
      - traefik.enable=false

networks:
  # Only Traefik and the backend router live here.
  edge:
  # internal: true means no outbound route and no host publishing — the gRPC
  # link between backend and inference never leaves the Docker bridge.
  internal:
    internal: true

volumes:
  traefik-acme:
  backend-data:
  inference-models:
